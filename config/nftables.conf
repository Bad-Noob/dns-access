#!/usr/sbin/nft -f

flush table inet dnsaccess

table inet dnsaccess {

    set dns4 {
        type ipv4_addr
        flags timeout
    }

    set dns6 {
        type ipv6_addr
        flags timeout
    }

    chain input {
        type filter hook input priority -100;
        policy accept;

        iifname "lo" udp dport 53 accept
        iifname "lo" tcp dport 53 accept

        ip saddr @dns4 udp dport 53 accept
        ip saddr @dns4 tcp dport 53 accept

        ip6 saddr @dns6 udp dport 53 accept
        ip6 saddr @dns6 tcp dport 53 accept

        udp dport 53 drop
        tcp dport 53 drop
    }
}
