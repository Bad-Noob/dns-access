http:
  address: 127.0.0.1:8081

users: []

dns:
  bind_hosts:
    - 127.0.0.1
    - __SERVER_IP__
    - "__SERVER_IPV6__"

  port: 53

  upstream_dns:
    - 127.0.0.1:5353

  bootstrap_dns:
    - 1.1.1.1
    - 9.9.9.9

  protection_enabled: true
  ratelimit: 0
  refuse_any: true

  cache_size: 67108864
  cache_ttl_min: 60
  cache_ttl_max: 86400

querylog:
  enabled: true

statistics:
  enabled: true

filtering:
  enabled: true
