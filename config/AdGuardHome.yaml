http:
  address: 127.0.0.1:8081

users: []

dns:
  bind_hosts:
    - 127.0.0.1
    - 0.0.0.0
    - ::1
    - ::

  port: 53

  upstream_dns:
    - 127.0.0.1:5353

  bootstrap_dns:
    - 1.1.1.1
    - 9.9.9.9

  protection_enabled: true
  ratelimit: 0
  refuse_any: true

  cache_size: 64mb
  cache_ttl_min: 60
  cache_ttl_max: 86400

tls:
  enabled: true

  server_name: __DOMAIN__

  port_https: 4443
  port_dns_over_tls: 0
  port_dns_over_quic: 0

  certificate_path: __SSL_CERT__
  private_key_path: __SSL_KEY__

querylog:
  enabled: true

statistics:
  enabled: true

filtering:
  enabled: true
